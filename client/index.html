<body>
    <script>
        (function () {
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <div id="root">
        <div id="loading-fallback"
            style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0c4a3e;color:white;font-family:sans-serif;text-align:center;">
            <div
                style="width:80px;height:80px;border:4px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 1s linear infinite;">
            </div>
            <p style="margin-top:20px;font-size:18px;">جاري تحميل محراب...</p>
            <style>
                @keyframes spin {
                    to {
                        transform: rotate(360deg)
                    }
                }
            </style>
        </div>
    </div>
    <script>
        // DEBUG: Show errors on screen
        window.onerror = function (msg, url, line, col, error) {
            alert('Error: ' + msg);
            var fallback = document.getElementById('loading-fallback');
            if (fallback) {
                fallback.innerHTML = '<div style="padding:20px;text-align:center;color:white;direction:rtl;">' +
                    '<h2>حدث خطأ</h2>' +
                    '<p style="font-size:14px;opacity:0.8;">يرجى تحديث الصفحة</p>' +
                    '<button onclick="location.reload()" style="margin-top:20px;padding:10px 30px;background:white;color:#0c4a3e;border:none;border-radius:8px;font-size:16px;cursor:pointer;">تحديث الصفحة</button>' +
                    '<p style="font-size:10px;margin-top:20px;opacity:0.5;user-select:all;">' + msg + '</p>' +
                    '</div>';
            }
            return false;
        };
        // EMERGENCY CLEANUP
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
                for (let reg of regs) { reg.unregister(); }
                console.log('Unregistered all SWs');
            });
        }
        if ('caches' in window) {
            caches.keys().then(function (names) {
                names.forEach(function (name) {
                    // Unconditionally delete all caches to clear corruption
                    if (name.indexOf('mihrab-app-v') !== -1 && name !== 'mihrab-app-v75') {
                        console.log('Deleting cache: ' + name);
                        caches.delete(name);
                    }
                });
            });
        }
    </script>
